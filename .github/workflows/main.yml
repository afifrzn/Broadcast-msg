name: Deploy CTF Dashboard to VM

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utamamu bernama master

jobs:
  deploy:
    name: Deploy to VPS / VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VM_HOST }}
          REMOTE_USER: ${{ secrets.VM_USERNAME }}
          TARGET: ${{ secrets.VM_TARGET_DIR }}
          EXCLUDE: "/.git/, /.github/"
